---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: adservice
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: adservice
    namespace: online-shop
  filterTags:
    pattern: '^(?P<date>[0-9]{8})-(?P<time>[0-9]{6})-[a-f0-9]{7}$'
    extract: '${date}${time}'
  policy:
    numerical:
      order: asc
