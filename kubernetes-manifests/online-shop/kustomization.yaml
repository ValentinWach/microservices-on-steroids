apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-shop
resources:
 - namespace.yaml
 - registry-creds.yaml
 - cluster-issuer.yaml
 - adservice.yaml
 - cartservice.yaml
 - checkoutservice.yaml
 - currencyservice.yaml
 - emailservice.yaml
 - frontend.yaml
# - loadgenerator.yaml
 - paymentservice.yaml
 - productcatalogservice.yaml
 - recommendationservice.yaml
 - shippingservice.yaml
patches:
  - target:
      kind: ServiceAccount
    patch: |
      - op: add
        path: /imagePullSecrets
        value:
          - name: registry-creds