---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: adservice
  namespace: online-shop
spec:
  image: registry.vwach.de/adservice
  interval: 3m
  secretRef:
    name: registry-creds
  accessFrom:
    namespaceSelectors:
      - matchLabels:
          kubernetes.io/metadata.name: flux-system
