name: Build, Push and Update GitOps Manifest

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-push-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/${{ inputs.service }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Update Kubernetes manifest
        run: |
          SERVICE="${{ inputs.service }}"
          IMAGE="${{ secrets.REGISTRY_HOST }}/${SERVICE}:${{ github.sha }}"
          MANIFEST="kubernetes-manifests/${SERVICE}.yaml"
          
          sed -i "s|image: .*|image: ${IMAGE}|" "${MANIFEST}"

      - name: Commit and push manifest update
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          git config user.name "github-actions-bot"
          git config user.email "contact@valentinwach.de"

          git pull
          git add "kubernetes-manifests/${SERVICE}.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): update ${SERVICE} image to ${GITHUB_SHA}"
          git push
